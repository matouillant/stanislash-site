<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <title>StaniSlash | La Troupe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<footer id="main-footer"></footer>
