<section>
    <h1>Contact</h1>
    <form style="display: flex; flex-direction: column; gap: 15px;">
        <input type="text" placeholder="Nom" style="padding: 10px; border: 2px solid var(--brand-blue);">
        <input type="email" placeholder="Email" style="padding: 10px; border: 2px solid var(--brand-blue);">
        <textarea placeholder="Votre message" rows="5" style="padding: 10px; border: 2px solid var(--brand-blue);"></textarea>
        <button type="submit" class="btn">Envoyer le message</button>
    </form>
</section>
